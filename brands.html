<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌目录 — KASUGA SHOJI 横滨典藏馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css?v=20261108">
</head>
<body>
<div id="header" data-active="brands"></div>

<section class="page-hero" style="padding:56px 0 48px">
  <div class="container">
    <span class="eyebrow">Brand Directory</span>
    <h1 class="display">品牌目录</h1>
    <p>馆藏涉及的 <b id="brand-total">—</b> 个品牌一览，点击进入对应商品列表。</p>
  </div>
</section>

<section style="padding:10px 0 80px">
  <div class="container">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:26px;flex-wrap:wrap">
      <div class="search-input-wrap" style="flex:1;min-width:240px;max-width:420px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="brand-q" placeholder="搜索品牌…" autocomplete="off">
      </div>
      <select class="sort-select" id="brand-sort">
        <option value="cnt">按商品数量</option>
        <option value="name">按名称</option>
      </select>
    </div>
    <div class="brand-grid" id="brand-grid"></div>
    <div id="brand-empty" style="display:none" class="muted">没有匹配的品牌</div>
  </div>
</section>

<div id="footer"></div>

<script src="assets/js/config.js?v=20261108"></script>
<script src="assets/js/data.js?v=20261108"></script>
<script src="assets/js/app.js?v=20261108"></script>
<script src="assets/js/layout.js?v=20261108"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const grid = document.getElementById("brand-grid");
  if (typeof PRODUCTS === "undefined" || !PRODUCTS.length) {
    grid.innerHTML = '<p class="muted">商品数据尚未生成，请先运行 tools/build-data.py。</p>';
    return;
  }
  // 品牌聚合
  const map = {};
  PRODUCTS.forEach((p) => {
    if (!p.brand) return;
    (map[p.brand] = map[p.brand] || { count: 0, cats: {} });
    map[p.brand].count++;
    map[p.brand].cats[p.cat] = (map[p.brand].cats[p.cat] || 0) + 1;
  });
  let brands = Object.entries(map).map(([name, v]) => ({ name, count: v.count, cats: v.cats }));

  function render() {
    const q = document.getElementById("brand-q").value.trim().toLowerCase();
    let list = brands.filter((b) => !q || b.name.toLowerCase().includes(q));
    const sort = document.getElementById("brand-sort").value;
    list.sort((a, b) => (sort === "name" ? a.name.localeCompare(b.name) : b.count - a.count));
    document.getElementById("brand-total").textContent = brands.length;
    document.getElementById("brand-empty").style.display = list.length ? "none" : "block";
    grid.innerHTML = list.map((b) => {
      const cats = Object.entries(b.cats).sort((x, y) => y[1] - x[1]).slice(0, 2)
        .map(([k]) => catName(k)).join(" / ");
      return `<a class="brand-card" href="shop.html?q=${encodeURIComponent(b.name)}">
        <b class="bc-name">${escHtml(b.name)}</b>
        <span class="bc-meta">${cats || "—"}</span>
        <span class="bc-count">${b.count} 件在册 →</span>
      </a>`;
    }).join("");
  }
  document.getElementById("brand-q").addEventListener("input", render);
  document.getElementById("brand-sort").addEventListener("change", render);
  render();
});
</script>
</body>
</html>
